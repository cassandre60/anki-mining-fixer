[project]
name = "anki-mining-fixer"
version = "0.3.1"
description = "Anki add-on: backfills mining cards from their enriched scene siblings"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"

[project.optional-dependencies]
dev = ["hypothesis", "pyright", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["mining_fixer", "scripts", "tests"]
extraPaths = ["scripts", "tests"]
reportMissingImports = "none"
